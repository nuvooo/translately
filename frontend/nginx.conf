# SDK requests may carry the API key as ?apiKey=: log the path ($uri)
# without the query string for /sdk/ routes.
log_format translately_sdk '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    # Resolve the backend at request time instead of once at startup: an
    # `upstream` block pins the IP nginx saw when it started, so a recreated
    # backend container (new IP after a deploy) would answer 502 until the
    # frontend is restarted too. A variable in proxy_pass forces a lookup via
    # the resolver. The proxy_pass directives carry no URI part on purpose:
    # the original request URI (path + query) is forwarded unchanged.
    resolver NGINX_RESOLVER valid=10s ipv6=off;
    set $backend_upstream "BACKEND_HOST:BACKEND_PORT";

    # Disable caching for JS/CSS files
    location ~* \.(js|css)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        # The two translation import routes accept JSON bodies of up to 2 MB
        # (MAX_IMPORT_BYTES in the backend); 3m leaves room for the envelope.
        # The backend enforces its own, tighter per-route limits.
        client_max_body_size 3m;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # AI translation routes: one request can wait for the model (up to two
    # attempts of 60 s each), so they get a longer read timeout. Otherwise the
    # same proxy settings as /api/.
    location ~ ^/api/projects/[^/]+/translations/ai/ {
        client_max_body_size 3m;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 150s;
    }

    # MCP endpoint: translate_missing waits for the AI model like the routes
    # above. Exact match, so only POST /api/mcp gets the longer timeout.
    location = /api/mcp {
        client_max_body_size 3m;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 150s;
    }

    location ^~ /sdk/ {
        access_log /var/log/nginx/access.log translately_sdk;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
